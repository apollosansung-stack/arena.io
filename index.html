<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Arena.io</title> <style> * { box-sizing: border-box; } html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, sans-serif; } canvas { display: block; width: 100%; height: 100%; cursor: crosshair; background-color: #171717; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; } /* HUD */ #hud { position: fixed; top: 15px; left: 15px; padding: 12px 16px; background: rgba(0,0,0,.7); color: white; border-radius: 10px; font-weight: bold; font-size: 17px; z-index: 10; user-select: none; } /* CONTADOR DE BOTS */ #botCounter { position: fixed; top: 15px; right: 15px; padding: 12px 16px; background: rgba(0,0,0,.7); color: white; border-radius: 10px; font-weight: bold; z-index: 10; } /* AJUDA */ #help { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 9px 15px; background: rgba(0,0,0,.65); color: #ddd; border-radius: 8px; font-size: 14px; z-index: 10; user-select: none; } /* MENU */ #menu { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle, #252525, #080808); color: white; text-align: center; } #menu h1 { margin: 0; font-size: 70px; letter-spacing: 4px; text-shadow: 0 0 10px rgba(255,255,255,.3); } #menu p { color: #aaa; font-size: 17px; margin: 10px 0 25px; } #playButton { border: 0; padding: 15px 45px; border-radius: 8px; background: #3498db; color: white; font-size: 20px; font-weight: bold; cursor: pointer; } #playButton:hover { background: #2980b9; transform: scale(1.04); } #menu.small h1 { font-size: 55px; } </style> </head> <body> <canvas id="game"></canvas> <!-- HUD --> <div id="hud"> 🏆 Pontos: <span id="score">0</span> <br> ❤️ Vida: <span id="hp">100</span> <br> 🔥 Nível: <span id="level">1</span> </div> <div id="botCounter"> 🤖 Bots: <span id="bots">0</span> </div> <div id="help"> WASD = mover &nbsp; • &nbsp; Mouse = mirar &nbsp; • &nbsp; Segure clique = atirar </div> <!-- MENU --> <div id="menu"> <h1 id="menuTitle"> Arena.io </h1> <p id="menuText"> Sobreviva aos bots e faça a maior pontuação! </p> <button id="playButton"> JOGAR </button> </div> <script> /* ===================================================== CANVAS ===================================================== */ const canvas = document.getElementById("game"); const ctx = canvas.getContext("2d"); function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } resize(); window.addEventListener( "resize", resize ); /* ===================================================== ÁUDIO ===================================================== */ let audioContext = null; function initAudio() { if (!audioContext) { audioContext = new ( window.AudioContext || window.webkitAudioContext )(); } if ( audioContext.state === "suspended" ) { audioContext.resume(); } } function sound( frequency, duration, type = "square", volume = 0.04 ) { if (!audioContext) { return; } const oscillator = audioContext.createOscillator(); const gain = audioContext.createGain(); oscillator.type = type; oscillator.frequency.setValueAtTime( frequency, audioContext.currentTime ); gain.gain.setValueAtTime( volume, audioContext.currentTime ); gain.gain.exponentialRampToValueAtTime( 0.001, audioContext.currentTime + duration ); oscillator.connect(gain); gain.connect( audioContext.destination ); oscillator.start(); oscillator.stop( audioContext.currentTime + duration ); } /* ===================================================== CONTROLES ===================================================== */ const keys = {}; window.addEventListener( "keydown", function(event) { keys[ event.key.toLowerCase() ] = true; } ); window.addEventListener( "keyup", function(event) { keys[ event.key.toLowerCase() ] = false; } ); /* ===================================================== MOUSE ===================================================== */ const mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false }; canvas.addEventListener( "mousemove", function(event) { mouse.x = event.clientX; mouse.y = event.clientY; } ); canvas.addEventListener( "mousedown", function() { mouse.down = true; initAudio(); } ); window.addEventListener( "mouseup", function() { mouse.down = false; } ); /* ===================================================== JOGADOR ===================================================== */ const player = { x: canvas.width / 2, y: canvas.height / 2, radius: 20, speed: 4, hp: 100, maxHp: 100, cooldown: 0 }; /* ===================================================== GAME STATE ===================================================== */ let playing = false; let score = 0; let level = 1; let botSpawnTimer = 0; /* ===================================================== ARRAYS ===================================================== */ const playerBullets = []; const botBullets = []; const bots = []; const particles = []; const texts = []; /* ===================================================== DISTÂNCIA ===================================================== */ function distance(a, b) { return Math.hypot( a.x - b.x, a.y - b.y ); } /* ===================================================== CRIAR BOT ===================================================== */ function createBot() { let x; let y; do { x = Math.random() * (canvas.width - 80) + 40; y = Math.random() * (canvas.height - 80) + 40; } while ( Math.hypot( x - player.x, y - player.y ) < 250 ); bots.push({ x: x, y: y, radius: 18, speed: 0.6 + Math.random() * 0.8, angle: Math.random() * Math.PI * 2, moveTimer: 30 + Math.random() * 100, shootTimer: 50 + Math.random() * 130 }); } /* ===================================================== CRIAR VÁRIOS BOTS ===================================================== */ function spawnBots() { bots.length = 0; const amount = 8 + level * 2; for ( let i = 0; i < amount; i++ ) { createBot(); } } /* ===================================================== PARTÍCULAS VERDES ===================================================== */ function greenParticles( x, y ) { for ( let i = 0; i < 20; i++ ) { const angle = Math.random() * Math.PI * 2; const speed = 1 + Math.random() * 4; particles.push({ x: x, y: y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed, size: 2 + Math.random() * 4, life: 20 + Math.random() * 25 }); } } /* ===================================================== TEXTO ===================================================== */ function floatingText( x, y, text ) { texts.push({ x: x, y: y, text: text, life: 45 }); } /* ===================================================== TIRO DO JOGADOR ===================================================== */ function playerShoot() { if ( player.cooldown > 0 ) { return; } const angle = Math.atan2( mouse.y - player.y, mouse.x - player.x ); playerBullets.push({ x: player.x + Math.cos(angle) * 25, y: player.y + Math.sin(angle) * 25, radius: 5, speed: 10, dx: Math.cos(angle), dy: Math.sin(angle) }); player.cooldown = 9; sound( 650, 0.05, "square", 0.035 ); } /* ===================================================== TIRO DO BOT ===================================================== */ function botShoot(bot) { const angle = Math.atan2( player.y - bot.y, player.x - bot.x ); botBullets.push({ x: bot.x, y: bot.y, radius: 5, speed: 4.5, dx: Math.cos(angle), dy: Math.sin(angle) }); sound( 170, 0.06, "sawtooth", 0.018 ); } /* ===================================================== ATUALIZAR JOGADOR ===================================================== */ function updatePlayer() { let dx = 0; let dy = 0; if (keys["w"]) { dy--; } if (keys["s"]) { dy++; } if (keys["a"]) { dx--; } if (keys["d"]) { dx++; } if ( dx !== 0 || dy !== 0 ) { const length = Math.hypot( dx, dy ); dx /= length; dy /= length; player.x += dx * player.speed; player.y += dy * player.speed; } player.x = Math.max( player.radius, Math.min( canvas.width - player.radius, player.x ) ); player.y = Math.max( player.radius, Math.min( canvas.height - player.radius, player.y ) ); if ( player.cooldown > 0 ) { player.cooldown--; } if (mouse.down) { playerShoot(); } } /* ===================================================== ATUALIZAR BOTS ===================================================== */ function updateBots() { for ( const bot of bots ) { bot.moveTimer--; if ( bot.moveTimer <= 0 ) { bot.angle = Math.random() * Math.PI * 2; bot.moveTimer = 40 + Math.random() * 100; } bot.x += Math.cos(bot.angle) * bot.speed; bot.y += Math.sin(bot.angle) * bot.speed; if ( bot.x < bot.radius || bot.x > canvas.width - bot.radius ) { bot.angle = Math.PI - bot.angle; } if ( bot.y < bot.radius || bot.y > canvas.height - bot.radius ) { bot.angle = -bot.angle; } bot.x = Math.max( bot.radius, Math.min( canvas.width - bot.radius, bot.x ) ); bot.y = Math.max( bot.radius, Math.min( canvas.height - bot.radius, bot.y ) ); /* tiro */ bot.shootTimer--; if ( bot.shootTimer <= 0 ) { botShoot(bot); bot.shootTimer = Math.max( 35, 120 - level * 5 ) + Math.random() * 80; } } } /* ===================================================== TIROS DO JOGADOR ===================================================== */ function updatePlayerBullets() { for ( let i = playerBullets.length - 1; i >= 0; i-- ) { const bullet = playerBullets[i]; bullet.x += bullet.dx * bullet.speed; bullet.y += bullet.dy * bullet.speed; if ( bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height ) { playerBullets.splice( i, 1 ); continue; } for ( let j = bots.length - 1; j >= 0; j-- ) { const bot = bots[j]; if ( distance( bullet, bot ) < bullet.radius + bot.radius ) { /* efeito */ greenParticles( bot.x, bot.y ); floatingText( bot.x, bot.y, "+10" ); sound( 110, 0.12, "sawtooth", 0.06 ); /* remover */ bots.splice( j, 1 ); playerBullets.splice( i, 1 ); score += 10; /* nível */ const newLevel = Math.floor( score / 100 ) + 1; if ( newLevel > level ) { level = newLevel; sound( 900, 0.2, "sine", 0.05 ); } break; } } } } /* ===================================================== TIROS DOS BOTS ===================================================== */ function updateBotBullets() { for ( let i = botBullets.length - 1; i >= 0; i-- ) { const bullet = botBullets[i]; bullet.x += bullet.dx * bullet.speed; bullet.y += bullet.dy * bullet.speed; if ( bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height ) { botBullets.splice( i, 1 ); continue; } if ( distance( bullet, player ) < bullet.radius + player.radius ) { greenParticles( player.x, player.y ); player.hp -= 10; botBullets.splice( i, 1 ); sound( 80, 0.15, "sawtooth", 0.07 ); if ( player.hp <= 0 ) { player.hp = 0; endGame(); } } } } /* ===================================================== PARTÍCULAS ===================================================== */ function updateParticles() { for ( let i = particles.length - 1; i >= 0; i-- ) { const p = particles[i]; p.x += p.dx; p.y += p.dy; p.dx *= 0.96; p.dy *= 0.96; p.life--; if ( p.life <= 0 ) { particles.splice( i, 1 ); } } } /* ===================================================== TEXTOS FLUTUANTES ===================================================== */ function updateTexts() { for ( let i = texts.length - 1; i >= 0; i-- ) { const t = texts[i]; t.y -= 0.7; t.life--; if ( t.life <= 0 ) { texts.splice( i, 1 ); } } } /* ===================================================== DESENHAR JOGADOR ===================================================== */ function drawPlayer() { const angle = Math.atan2( mouse.y - player.y, mouse.x - player.x ); ctx.save(); ctx.translate( player.x, player.y ); ctx.rotate(angle); /* corpo */ ctx.fillStyle = "#3498db"; ctx.beginPath(); ctx.arc( 0, 0, player.radius, 0, Math.PI * 2 ); ctx.fill(); /* arma */ ctx.fillStyle = "#222"; ctx.fillRect( 8, -5, 30, 10 ); ctx.restore(); /* barra de vida */ ctx.fillStyle = "#333"; ctx.fillRect( player.x - 25, player.y - 34, 50, 6 ); ctx.fillStyle = "#2ecc71"; ctx.fillRect( player.x - 25, player.y - 34, 50 * (player.hp / player.maxHp), 6 ); } /* ===================================================== DESENHAR BOTS ===================================================== */ function drawBots() { for ( const bot of bots ) { ctx.fillStyle = "#e74c3c"; ctx.beginPath(); ctx.arc( bot.x, bot.y, bot.radius, 0, Math.PI * 2 ); ctx.fill(); /* olhos */ ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc( bot.x - 6, bot.y - 4, 3, 0, Math.PI * 2 ); ctx.arc( bot.x + 6, bot.y - 4, 3, 0, Math.PI * 2 ); ctx.fill(); } } /* ===================================================== DESENHAR TIROS ===================================================== */ function drawBullets() { /* jogador */ ctx.fillStyle = "#f1c40f"; for ( const bullet of playerBullets ) { ctx.beginPath(); ctx.arc( bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2 ); ctx.fill(); } /* bots */ ctx.fillStyle = "#ff8c42"; for ( const bullet of botBullets ) { ctx.beginPath(); ctx.arc( bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2 ); ctx.fill(); } } /* ===================================================== DESENHAR PARTÍCULAS ===================================================== */ function drawParticles() { for ( const p of particles ) { ctx.globalAlpha = Math.max( 0, p.life / 45 ); ctx.fillStyle = "#39ff14"; ctx.beginPath(); ctx.arc( p.x, p.y, p.size, 0, Math.PI * 2 ); ctx.fill(); } ctx.globalAlpha = 1; } /* ===================================================== DESENHAR TEXTOS ===================================================== */ function drawTexts() { ctx.textAlign = "center"; ctx.font = "bold 18px Arial"; for ( const t of texts ) { ctx.globalAlpha = t.life / 45; ctx.fillStyle = "#39ff14"; ctx.fillText( t.text, t.x, t.y ); } ctx.globalAlpha = 1; } /* ===================================================== MIRA ===================================================== */ function drawCrosshair() { ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo( mouse.x - 10, mouse.y ); ctx.lineTo( mouse.x + 10, mouse.y ); ctx.moveTo( mouse.x, mouse.y - 10 ); ctx.lineTo( mouse.x, mouse.y + 10 ); ctx.stroke(); } /* ===================================================== HUD ===================================================== */ function updateHUD() { document.getElementById( "score" ).textContent = score; document.getElementById( "hp" ).textContent = player.hp; document.getElementById( "level" ).textContent = level; document.getElementById( "bots" ).textContent = bots.length; } /* ===================================================== GAME OVER ===================================================== */ function endGame() { playing = false; mouse.down = false; sound( 60, 0.6, "sawtooth", 0.08 ); const menu = document.getElementById( "menu" ); const title = document.getElementById( "menuTitle" ); const text = document.getElementById( "menuText" ); const button = document.getElementById( "playButton" ); title.textContent = "GAME OVER"; text.textContent = "Você fez " + score + " pontos"; button.textContent = "JOGAR NOVAMENTE"; menu.style.display = "flex"; } /* ===================================================== INICIAR JOGO ===================================================== */ function startGame() { initAudio(); playing = true; score = 0; level = 1; player.x = canvas.width / 2; player.y = canvas.height / 2; player.hp = player.maxHp; player.cooldown = 0; playerBullets.length = 0; botBullets.length = 0; particles.length = 0; texts.length = 0; spawnBots(); document.getElementById( "menu" ).style.display = "none"; updateHUD(); } /* ===================================================== BOT RESPAWN ===================================================== */ function manageBots() { if (!playing) { return; } const wanted = 8 + level * 2; if ( bots.length < wanted ) { botSpawnTimer--; if ( botSpawnTimer <= 0 ) { createBot(); botSpawnTimer = 30; } } } /* ===================================================== LOOP PRINCIPAL ===================================================== */ function gameLoop() { /* limpar */ ctx.clearRect( 0, 0, canvas.width, canvas.height ); if (playing) { updatePlayer(); updateBots(); updatePlayerBullets(); updateBotBullets(); updateParticles(); updateTexts(); manageBots(); drawBots(); drawBullets(); drawParticles(); drawTexts(); drawPlayer(); drawCrosshair(); updateHUD(); } requestAnimationFrame( gameLoop ); } /* ===================================================== BOTÃO DO MENU ===================================================== */ document.getElementById( "playButton" ).addEventListener( "click", startGame ); /* ===================================================== COMEÇAR LOOP ===================================================== */ gameLoop(); </script> </body> </html>
